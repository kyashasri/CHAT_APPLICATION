<!DOCTYPE html>
<html>
<head>

<title>Profile</title>

<style>

body{
font-family:Segoe UI;
background:#EEFABD;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

/* CARD */

.profile-card{
background:white;
padding:30px;
border-radius:12px;
width:400px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
position:relative; /* needed for back button */
}

.profile-card h2{
margin-bottom:20px;
color:#263B6A;
}

/* BACK BUTTON */

.back-btn{
position:absolute;
top:10px;
left:10px;
width:auto;              /* ⭐ important fix */
padding:4px 10px;
font-size:12px;
border:none;
border-radius:5px;
background:#6984A9;
color:white;
cursor:pointer;
}

.back-btn:hover{
background:#A0D585;
color:#263B6A;
}

/* PROFILE PIC */

.profile-pic{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
}

/* INPUTS */

input,textarea{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

/* PLACEHOLDER FIX */

textarea::placeholder{
color:#888;
opacity:1;
}

/* BUTTON */

button{
width:100%;
padding:10px;
background:#A0D585;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:500;
}

button:hover{
background:#6984A9;
color:white;
}

</style>

</head>

<body>

<div class="profile-card">

<!-- BACK BUTTON -->
<button class="back-btn" onclick="window.history.back()">← Back</button>

<h2>Update Profile</h2>

<img id="preview"
src="{{ user.profile_pic }}"
class="profile-pic">

<form id="profileForm">

<input type="text" name="name" value="{{ user.name }}" required>

<!-- BIO WITH PLACEHOLDER -->
<textarea name="bio" placeholder="Add your bio...">{{ user.bio }}</textarea>

<input type="file" name="profile_pic" id="profilePic">

<button type="submit">Update Profile</button>

</form>

</div>

<script>

document.getElementById("profileForm").onsubmit = async function(e){

e.preventDefault();

let formData = new FormData(this);

let res = await fetch("/update_profile",{
method:"POST",
body:formData
});

let data = await res.json();

if(data.success){

alert("Profile updated successfully!");

if(data.name){
document.querySelectorAll(".profile-name")
.forEach(el=>el.innerText=data.name);
}

if(data.profile_pic){
document.getElementById("preview").src=data.profile_pic;
}

}

};

</script>

</body>
</html>
