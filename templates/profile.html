<!DOCTYPE html>
<html>
<head>
<title>Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100%;
    font-family: 'Poppins', sans-serif;
    background-image: url("{{ url_for('static', filename='backImage.png') }}");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
  }

  .profile-card {
    background: rgba(255,255,255,0.9);
    padding: 40px;
    border-radius: 20px;
    width: 420px;
    text-align: center;
    border: 2px solid #14B8A6;
    position: relative;
  }

  h2 {
    margin-bottom: 20px;
  }

  /* ✅ SMALL BACK BUTTON */
  .back-btn {
    position: absolute;
    top: 12px;
    left: 12px;

    width: 34px;
    height: 34px;

    border-radius: 50%;
    border: none;

    background: rgba(20,184,166,0.15);
    color: #0f766e;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
    transition: 0.2s;
  }

  .back-btn:hover {
    background: #14B8A6;
    color: white;
  }

  /* PROFILE CIRCLE */
  .profile-pic {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin: 0 auto 15px;
    border: 3px solid #14B8A6;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    cursor: pointer;
    background: #e6fffa;
    font-size: 32px;
    font-weight: bold;
    color: #0f766e;
  }

  .profile-pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  input, textarea {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .save-btn {
    background: #14B8A6;
    color: white;
  }

  .remove-btn {
    background: #ef4444;
    color: white;
  }

  .hint {
    font-size: 12px;
    color: gray;
    margin-top: 5px;
  }

  input[type="file"] {
    display: none;
  }
</style>
</head>

<body>

<div class="profile-card">

  <!-- ✅ SMALL BACK BUTTON -->
  <button class="back-btn" onclick="window.history.back()">←</button>

  <h2>Update Profile</h2>

  <!-- PROFILE IMAGE / INITIAL -->
  <div class="profile-pic" id="profileContainer"
       onclick="document.getElementById('profileInput').click()">

    {% if user.profile_pic %}
      <img id="profilePreview" src="{{ user.profile_pic }}">
    {% else %}
      <span id="profileInitial">{{ user.name[0] }}</span>
      <img id="profilePreview" style="display:none;">
    {% endif %}

  </div>

  <div class="hint">Click circle to change photo</div>

  <!-- FORM -->
  <form id="profileForm">

    <input type="text" name="name" value="{{ user.name }}" required>
    <textarea name="bio" placeholder="Add bio...">{{ user.bio }}</textarea>

    <input type="file" id="profileInput" name="profile_pic" accept="image/*">

    <button type="submit" class="save-btn">Update Profile</button>
  </form>

  <button type="button" id="removeBtn" class="remove-btn">
    Remove Profile Photo
  </button>

</div>

<script>

// IMAGE PREVIEW
document.getElementById("profileInput").addEventListener("change", function () {
    const file = this.files[0];

    if (file) {
        const reader = new FileReader();

        reader.onload = function (e) {
            document.getElementById("profilePreview").src = e.target.result;
            document.getElementById("profilePreview").style.display = "block";

            let initial = document.getElementById("profileInitial");
            if (initial) initial.style.display = "none";
        };

        reader.readAsDataURL(file);
    }
});

// UPDATE PROFILE
document.getElementById("profileForm").onsubmit = async function (e) {
    e.preventDefault();

    let btn = this.querySelector("button[type='submit']");
    btn.innerText = "Saving...";
    btn.disabled = true;

    let formData = new FormData(this);

    let file = document.getElementById("profileInput").files[0];
    if (file) {
        formData.append("profile_pic", file);
    }

    let res = await fetch("/update_profile", {
        method: "POST",
        body: formData
    });

    let data = await res.json();

    btn.innerText = "Update Profile";
    btn.disabled = false;

    if (data.success) {
        alert("✅ Profile updated!");
    } else {
        alert("❌ Update failed");
    }
};

// REMOVE PROFILE PHOTO
document.getElementById("removeBtn").onclick = async function () {

    if (!confirm("Remove profile photo?")) return;

    let res = await fetch("/remove_profile_pic", {
        method: "POST"
    });

    let data = await res.json();

    if (data.success) {

        document.getElementById("profilePreview").style.display = "none";

        let initial = document.getElementById("profileInitial");

        if (!initial) {
            let span = document.createElement("span");
            span.id = "profileInitial";
            span.innerText = "{{ user.name[0] }}";
            document.getElementById("profileContainer").appendChild(span);
        } else {
            initial.style.display = "block";
        }

        document.getElementById("profileInput").value = "";

        alert("✅ Profile removed!");
    } else {
        alert("❌ Failed");
    }
};

</script>

</body>
</html>
